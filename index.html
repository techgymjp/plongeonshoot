<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ムササビシュート</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="rotate">
  <div class="phone"></div>
  <p data-i18n="rotate.msg">スマホを横向きにしてください</p>
  <small data-i18n="rotate.sub">ムササビシュートは横画面で遊ぶゲームです</small>
</div>
<div id="wrap">
<div id="stage">
  <canvas id="view"></canvas>
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="hud-box">SCORE <b id="score">0</b></div>
    <div class="hud-box" id="shotInfo">1 / 20</div>
    <div class="hud-box" id="steps"><span data-i18n="hud.steps">歩数</span><i></i><i></i><i></i></div>
    <div class="hud-box" id="bestBox">BEST <b id="best">0</b></div>
    <div class="hud-right">
      <button id="navBtn" type="button">ナビ ON</button>
      <button id="muteBtn" type="button" aria-label="sound">🔊</button>
    </div>
  </div>

  <div id="msg"><div class="big"></div><div class="sub"></div></div>

  <!-- タイトル -->
  <div id="title" class="overlay show">
    <div class="panel">
      <h1 data-i18n="title">ムササビシュート</h1>
      <p class="lead" data-i18n-html="title.lead"></p>
      <button id="startBtn" class="big-btn" data-i18n="btn.start">スタート</button>
      <button id="helpBtn" class="sub-btn" data-i18n="btn.help">遊び方</button>
      <p class="best" id="titleBest"></p>
      <div id="langSel">
        <button class="langBtn" type="button" data-lang="ja">日本語</button>
        <button class="langBtn" type="button" data-lang="en">English</button>
      </div>
    </div>
  </div>

  <!-- 遊び方(別画面) -->
  <div id="help" class="overlay">
    <div class="panel help">
      <h2 data-i18n="help.title">遊び方</h2>
      <div class="help-body" data-i18n-html="help.body"></div>
      <button id="helpBack" class="big-btn" data-i18n="btn.back">もどる</button>
    </div>
  </div>

  <!-- 結果 -->
  <div id="result" class="overlay">
    <div class="panel">
      <h2 data-i18n="result.title">結果</h2>
      <div id="rank"></div>
      <div id="finalScore"></div>
      <div id="newRecord"></div>
      <div id="share">
        <button id="shareBtn" class="sbtn main" type="button"><span data-i18n="share.btn">📤 結果をシェア</span><small id="shareMsg"></small></button>
        <div class="row">
          <a id="shareX" class="sbtn" target="_blank" rel="noopener" data-i18n="share.post">𝕏 ポスト</a>
          <a id="shareLine" class="sbtn" target="_blank" rel="noopener">LINE</a>
          <button id="shareCopy" class="sbtn" type="button" data-i18n="share.copy">コピー</button>
        </div>
      </div>
      <ol id="history"></ol>
      <button id="retryBtn" class="big-btn" data-i18n="btn.retry">もう一度</button>
      <button id="titleBtn" class="sub-btn" data-i18n="btn.title">タイトルへ</button>
    </div>
  </div>

  <!-- 一時停止 -->
  <div id="pause" class="overlay">
    <div class="panel small">
      <h2 data-i18n="pause.title">PAUSE</h2>
      <button id="resumeBtn" class="big-btn" data-i18n="btn.resume">再開</button>
      <button id="pauseTitleBtn" class="sub-btn" data-i18n="btn.title">タイトルへ</button>
    </div>
  </div>
</div>
</div>
<script src="vendor/three.min.js"></script>
<script src="i18n.js"></script>
<script src="scene3d.js"></script>
<script src="game.js"></script>
</body>
</html>
