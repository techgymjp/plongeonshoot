name: iOS build

# 既定ブランチへの push（と手動実行）で、本番広告の設定で Archive し、TestFlight にアップロードする。
# ビルド番号は「この workflow の実行回数 + 100」（Mac の Xcode から手で上げるときは 100 未満を使う）。
# 署名の Secrets がないとき・ほかのブランチでは、署名なしでシミュレーター向けにビルドできるかだけを確かめる。
# 審査への提出は App Store Connect で行う（docs/IOS_BUILD.md）
on:
  push:
    paths:
      - 'index.html'
      - '*.js'
      - '*.css'
      - 'manifest.json'
      - 'vendor/**'
      - 'ios/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

# pipefail を付けて、xcodebuild | tail で失敗が隠れないようにする
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      TEAM_ID: GNM3VTX9YG
      BUNDLE_ID: jp.techgym.plongeonshoot
      PROFILE_NAME: plongeonshoot App Store (CI)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        timeout-minutes: 5
        run: npm ci

      # Secrets がそろっていて、既定ブランチなら TestFlight にアップロードする
      - name: Decide whether to upload
        id: mode
        env:
          P12: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          echo "BUILD_NUMBER=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"
          BUILD_NUMBER=$((GITHUB_RUN_NUMBER + 100))
          if [ -n "$P12" ] && [ -n "$KEY_ID" ] && [ -n "$ISSUER" ] && [ -n "$P8" ] \
             && [ "$GITHUB_REF" = "refs/heads/${{ github.event.repository.default_branch }}" ]; then
            echo "upload=true" >> "$GITHUB_OUTPUT"
            echo "TestFlight にアップロードします（ビルド番号 ${BUILD_NUMBER}）"
          else
            echo "upload=false" >> "$GITHUB_OUTPUT"
            echo "署名なしのビルド確認だけを行います"
          fi

      - name: Copy web assets into the iOS project (test ads)
        if: steps.mode.outputs.upload != 'true'
        run: |
          npm run build
          npx cap sync ios

      # bash は pipefail で動くので、xcodebuild が失敗すればこのステップも失敗する
      - name: Build for the simulator (no signing)
        if: steps.mode.outputs.upload != 'true'
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40

      - name: Copy web assets into the iOS project (production ads)
        if: steps.mode.outputs.upload == 'true'
        run: |
          ADMOB_MODE=production npm run build
          npx cap sync ios

      # 配布用の証明書を一時的なキーチェーンに入れ、API キーをファイルに書き出す
      - name: Install the signing certificate and API key
        if: steps.mode.outputs.upload == 'true'
        env:
          P12: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/dist.p12"
          echo "$P8" | base64 --decode > "$RUNNER_TEMP/AuthKey_$KEY_ID.p8"

      # 開発用の証明書は作らず（アカウントの上限に当たる）、配布用のプロファイルを API で作って手動署名にする
      - name: Create the App Store provisioning profile
        if: steps.mode.outputs.upload == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          node scripts/asc-profile.js "$BUNDLE_ID" "$PROFILE_NAME" "$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          # App ターゲットだけを手動署名にする（コマンドラインで渡すと Swift Package のターゲットにも効いてしまう）
          sed -i '' "s/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual; CODE_SIGN_IDENTITY = \"Apple Distribution\"; PROVISIONING_PROFILE_SPECIFIER = \"$PROFILE_NAME\";/" ios/App/App.xcodeproj/project.pbxproj
          grep -n "CODE_SIGN_STYLE" ios/App/App.xcodeproj/project.pbxproj

      - name: Archive
        if: steps.mode.outputs.upload == 'true'
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CURRENT_PROJECT_VERSION="${BUILD_NUMBER}" \
            archive | tail -60

      - name: Upload to App Store Connect (TestFlight)
        if: steps.mode.outputs.upload == 'true'
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" | tail -40
          echo "アップロードしました（Version $(node -p "require('./package.json').version")、ビルド ${BUILD_NUMBER}）。10〜30 分ほどで TestFlight に出ます"

      - name: Clean up the keychain and key
        if: always() && steps.mode.outputs.upload == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8
